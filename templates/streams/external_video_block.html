{% comment %}External video links — plain prose list with tertiary link buttons.{% endcomment %}
{% load icons %}
<ol class="ds-prose__video-list">
  {% for external_video in self %}
    <li>
      <a class="ds-button ds-button--tertiary ds-button--on-light" href="{{ external_video.video_url }}" target="_blank" rel="noopener noreferrer">
        <span class="ds-button__label">Watch: {{ external_video.title }}</span>
        {% ds_icon 'chevron-right' css_class='ds-button__icon' %}
      </a>
    </li>
  {% endfor %}
</ol>
