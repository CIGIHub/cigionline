{% comment %}Autoplay video — prose media treatment with the standard caption.{% endcomment %}
<figure class="ds-prose__media">
  <video playsinline autoplay muted controls loop>
    <source src="{{ self.video.url }}" type="video/mp4">
  </video>
  {% if self.caption %}<figcaption>{{ self.caption }}</figcaption>{% endif %}
</figure>
