{% comment %}
  External quote — same treatment as block_quote (red top rule); the source
  line reuses the quote-author styling.
{% endcomment %}
<div class="stream-block-blockquote">
  <blockquote>{{ self.quote }}</blockquote>
  {% if self.source %}
    <div class="stream-block-blockquote-author">{{ self.source }}</div>
  {% endif %}
</div>
