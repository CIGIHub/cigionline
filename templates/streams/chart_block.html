{% load wagtailimages_tags %}
{% comment %}
  Chart — prose figure treatment (Blog Post spec): image at the column measure,
  optional title above, caption with the left rule below.
{% endcomment %}
<figure class="ds-prose__chart">
  {% if self.title %}<p class="ds-prose__chart-title">{{ self.title }}</p>{% endif %}
  {% image self.image width-1280 %}
  {% if not self.hide_image_caption and self.image.caption %}
    <figcaption>{{ self.image.caption }}</figcaption>
  {% endif %}
</figure>
