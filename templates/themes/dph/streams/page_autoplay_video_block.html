<div class="stream-block-autoplay-video">
  <video playsinline{% if not self.disable_autoplay %} autoplay{% endif %} muted controls>
    <source src="{{ self.video.url }}" type="video/mp4">
  </video>
  {% if self.caption %}
    <div class="caption">
      {{ self.caption }}
    </div>
  {% endif %}
</div>
